# Se instala en /etc/nginx/conf.d/ (contexto http). Aplica a todos los sitios.

server_tokens off;

# Límites contra clientes lentos / payloads abusivos
client_body_timeout   30s;
client_header_timeout 15s;
send_timeout          30s;
large_client_header_buffers 4 16k;

# Rate limiting (se aplican en el sitio)
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# Necesario para proxy de WebSocket si algún día se usa
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
