# Headers de seguridad. Se instala en /etc/nginx/snippets/.
# Ojo: add_header en un location anula los del server, por eso se incluye en cada uno.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# same-origin-allow-popups: necesario para el popup de "Login con Google"
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
