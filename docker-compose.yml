# Stack de producción. Las imágenes de backend y frontend NO se construyen acá:
# las publica GitHub Actions en ghcr.io (BACKEND_TAG / FRONTEND_TAG en .env) y
# este compose solo las descarga. Para construirlas en local: docker-compose.build.yml
#
# Todos los puertos se publican SOLO en 127.0.0.1:
# desde internet únicamente se llega por el nginx del servidor (80/443).
# (Docker ignora UFW para puertos publicados en 0.0.0.0, por eso nunca se usa.)

name: sistema

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *defaults
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [interna]

  backend:
    <<: *defaults
    image: ${REGISTRY:-ghcr.io/jsplusinfra}/${BACKEND_IMAGE:-baseback}:${BACKEND_TAG:-sin-version}
    environment: &backend_env
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      JWT_EXPIRATION_ACCESS: ${JWT_EXPIRATION_ACCESS:-60s}
      JWT_EXPIRATION_REFRESH: ${JWT_EXPIRATION_REFRESH:-7d}
      PUNTO_VENTA_ACTIVO_ID: ${PUNTO_VENTA_ACTIVO_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      AFIP_ENV: ${AFIP_ENV:-homologacion}
      AFIP_CUIT: ${AFIP_CUIT}
      AFIP_PUNTO_VENTA: ${AFIP_PUNTO_VENTA}
      AFIP_LETRA_EMISOR: ${AFIP_LETRA_EMISOR}
      AFIP_CERT: /app/certs/AFIP.crt
      AFIP_KEY: /app/certs/privada.key
      # Estadísticas: el backend firma la URL del tablero; Metabase se publica en /metabase
      METABASE_SITE_URL: https://${DOMAIN}/metabase
      METABASE_SECRET_KEY: ${METABASE_SECRET_KEY:-}
      METABASE_DASHBOARD_VENTAS: ${METABASE_DASHBOARD_VENTAS:-}
      METABASE_DASHBOARD_CLIENTES: ${METABASE_DASHBOARD_CLIENTES:-}
      METABASE_DASHBOARD_NEGOCIO: ${METABASE_DASHBOARD_NEGOCIO:-}
      METABASE_DASHBOARD_COBRANZAS: ${METABASE_DASHBOARD_COBRANZAS:-}
      METABASE_DASHBOARD_FICHA: ${METABASE_DASHBOARD_FICHA:-}
      METABASE_DASHBOARD_VENDEDORES: ${METABASE_DASHBOARD_VENDEDORES:-}
      # Tableros propios (ECharts) del backend nuevo: cada cuánto se refresca la tabla de ventas.
      # 0 = no se refresca sola. La línea vieja (BaseBack) ignora estas variables.
      TABLEROS_REFRESCO_MINUTOS: ${TABLEROS_REFRESCO_MINUTOS:-120}
      # Botón de análisis con IA en los tableros. Apagado: necesita Ollama, que no corre acá.
      IA_HABILITADA: ${IA_HABILITADA:-false}
      # Seeds: los /api/seed-*/execute responden 404 salvo HABILITAR_SEEDS=true. Dejar vacío en producción.
      HABILITAR_SEEDS: ${HABILITAR_SEEDS:-}
      SEED_ROOT_PASSWORD: ${SEED_ROOT_PASSWORD:-}
      # Análisis con IA (Ollama). Vacío = deshabilitado (no entra en un VPS de 2 GB)
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - uploads:/app/uploads
      - ./secrets/afip:/app/certs:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  # Corre las migraciones de TypeORM y termina: docker compose --profile tools run --rm migrate
  # Usa la MISMA imagen del backend (trae las migraciones compiladas en dist/).
  migrate:
    image: ${REGISTRY:-ghcr.io/jsplusinfra}/${BACKEND_IMAGE:-baseback}:${BACKEND_TAG:-sin-version}
    command: ["node", "node_modules/typeorm/cli.js", "migration:run", "-d", "dist/orm.config.js"]
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    profiles: ["tools"]

  frontend:
    <<: *defaults
    image: ${REGISTRY:-ghcr.io/jsplusinfra}/${FRONTEND_IMAGE:-basefront}:${FRONTEND_TAG:-sin-version}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [interna]

  # ---------- Herramientas opcionales (solo por túnel SSH, nunca públicas) ----------
  # docker compose --profile admin up -d phpmyadmin
  phpmyadmin:
    <<: *defaults
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 512M
    ports:
      - "127.0.0.1:8081:80"
    depends_on: [db]
    networks: [interna]
    profiles: ["admin"]

  # docker compose --profile metabase up -d metabase   (VPS de 2 GB o más)
  # Desde internet solo se ve el tablero embebido (nginx: /metabase/embed/...).
  # La administración se usa por túnel SSH: http://localhost:3002
  metabase:
    <<: *defaults
    image: metabase/metabase:v0.56.x
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: https://${DOMAIN}/metabase
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
      # Memoria de Java. Con 768m Metabase usa ~1 GB en total.
      JAVA_OPTS: -Xmx${METABASE_MEMORIA:-768m}
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:3002:3000"
    depends_on: [db]
    networks: [interna]
    profiles: ["metabase"]

volumes:
  db_data:
  uploads:
  metabase_data:

networks:
  interna:
